name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    # 공개 리포에서만 실행. wip에 동일 버전 태그를 달아도 goreleaser/시크릿 없이 실패하지 않게 함.
    # (wip 태그는 버전 표식용이며, 바이너리 배포는 chorr/whoo-cli 전용)
    if: github.repository == 'chorr/whoo-cli'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WHOOING_APP_ID: ${{ secrets.WHOOING_APP_ID }}
          WHOOING_APP_SECRET: ${{ secrets.WHOOING_APP_SECRET }}
